name: LoreHub CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lorehub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: lorehub
          POSTGRES_PASSWORD: lorehub-ci
          POSTGRES_USER: lorehub
        options: >-
          --health-cmd "pg_isready -U lorehub -d lorehub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://lorehub:lorehub-ci@127.0.0.1:5432/lorehub
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: npm ci
      - run: npm run format:check
      - run: npm run limits
      - run: npm run keycloak:check
      - run: npm run keycloak:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run api:format:check
      - run: npm run api:lint
      - run: npm run api:test
      - run: npm run api:build
      - run: npm run security
      - run: npm run db:migrate

  lore-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/lore/Dockerfile
          target: lore-tests
          outputs: type=cacheonly
          cache-from: type=gha,scope=lore-policy
          cache-to: type=gha,mode=max,scope=lore-policy,ignore-error=true,timeout=20m
      - name: Build Lore Server integration image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/lore/Dockerfile
          load: true
          tags: lorehub/lore-integration-server:ci
          cache-from: type=gha,scope=lore-policy-server
          cache-to: type=gha,mode=max,scope=lore-policy-server,ignore-error=true,timeout=20m
      - name: Build Lore client integration image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/lore/test.Dockerfile
          load: true
          tags: lorehub/lore-integration-client:ci
          cache-from: type=gha,scope=lore-policy-client
          cache-to: type=gha,mode=max,scope=lore-policy-client,ignore-error=true,timeout=20m
      - name: Test Lore Server integration
        env:
          LORE_TEST_SERVER_IMAGE: lorehub/lore-integration-server:ci
          LORE_TEST_CLIENT_IMAGE: lorehub/lore-integration-client:ci
        run: scripts/lore-merge-integration.sh
