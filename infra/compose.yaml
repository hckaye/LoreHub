name: lorehub

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: lorehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorehub-development}
      POSTGRES_USER: lorehub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorehub -d lorehub"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks: [default, runner-network]
    volumes:
      - postgres-data:/var/lib/postgresql

  lore:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/lore/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:41339/health_check"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "41337:41337/tcp"
      - "41337:41337/udp"
      - "41339:41339"
    networks: [default, runner-network]
    volumes:
      - lore-data:/data

  api:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lorehub:${POSTGRES_PASSWORD:-lorehub-development}@postgres:5432/lorehub
      LOREHUB_ENV: development
      LOREHUB_HTTP_ADDRESS: :8080
      LOREHUB_LORE_IDENTITY: ${LOREHUB_LORE_IDENTITY:-}
      LOREHUB_OIDC_AUDIENCE: ${LOREHUB_OIDC_AUDIENCE:-}
      LOREHUB_OIDC_ISSUER: ${LOREHUB_OIDC_ISSUER:-}
      LOREHUB_RUNNER_ARTIFACT_DIR: /var/lib/lorehub/runner-data/runner-artifacts
      LOREHUB_RUNNER_LOG_DIR: /var/lib/lorehub/runner-data/runner-logs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - api-data:/var/lib/lorehub
      - runner-data:/var/lib/lorehub/runner-data:ro

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    environment:
      LOREHUB_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

  runner:
    profiles: ["runner"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    command: ["runner"]
    environment:
      DATABASE_URL: postgresql://lorehub:${POSTGRES_PASSWORD:-lorehub-development}@postgres:5432/lorehub
      DOCKER_HOST: tcp://runner-engine:2375
      LOREHUB_ENV: development
      LOREHUB_LORE_IDENTITY: ${LOREHUB_LORE_IDENTITY:-}
      LOREHUB_LORE_CACHE_DIR: /var/lib/lorehub/runner-data/repositories
      LOREHUB_RUNNER_ARTIFACT_DIR: /var/lib/lorehub/runner-data/runner-artifacts
      LOREHUB_RUNNER_LOG_DIR: /var/lib/lorehub/runner-data/runner-logs
      LOREHUB_RUNNER_WORK_DIR: /var/lib/lorehub/runner-data/runner-work
    depends_on:
      postgres:
        condition: service_healthy
      lore:
        condition: service_healthy
      runner-engine:
        condition: service_healthy
      runner-data-init:
        condition: service_completed_successfully
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-network]
    volumes:
      - runner-data:/var/lib/lorehub/runner-data

  runner-data-init:
    profiles: ["runner"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /var/lib/lorehub/runner-data/repositories
        /var/lib/lorehub/runner-data/runner-logs
        /var/lib/lorehub/runner-data/runner-artifacts
        /var/lib/lorehub/runner-data/runner-work
        && chown -R lorehub:lorehub /var/lib/lorehub/runner-data
    user: "0:0"
    restart: "no"
    volumes:
      - runner-data:/var/lib/lorehub/runner-data

  runner-engine:
    profiles: ["runner"]
    platform: linux/amd64
    image: docker:29.4.0-dind-rootless
    environment:
      DOCKER_TLS_CERTDIR: ""
    privileged: true
    cpus: 3
    mem_limit: 4g
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [runner-network, runner-egress]
    volumes:
      - runner-engine-data:/home/rootless/.local/share/docker

volumes:
  api-data:
  lore-data:
  postgres-data:
  runner-data:
  runner-engine-data:

networks:
  runner-network:
    internal: true
  runner-egress:
