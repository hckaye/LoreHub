name: lorehub

services:
  tls-init:
    build:
      context: ..
      dockerfile: infra/auth-tls/Dockerfile
    volumes:
      - auth-ca-state:/state
      - auth-tls:/tls
      - ./.local-tls:/export
      - ${LOREHUB_TLS_SOURCE_DIR:-./.local-tls}:/input:ro
    environment:
      LOREHUB_ENV: ${LOREHUB_ENV:-development}
      LOREHUB_LORE_ROOT_DOMAIN: ${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}
      LOREHUB_LORE_INTERNAL_DOMAIN: >-
        ${LOREHUB_LORE_INTERNAL_DOMAIN:?LOREHUB_LORE_INTERNAL_DOMAIN is required}
      LOREHUB_TLS_SERVER_NAMES: ${LOREHUB_TLS_SERVER_NAMES:?LOREHUB_TLS_SERVER_NAMES is required}
    restart: "no"

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: lorehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: lorehub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorehub -d lorehub"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      runner-data:
        ipv4_address: 172.28.239.2
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.7
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

  lore:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/lore/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:41339/health_check"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      LOREHUB_ENV: ${LOREHUB_ENV:-development}
      LOREHUB_LORE_ROOT_DOMAIN: ${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}
      LOREHUB_LORE_INTERNAL_DOMAIN: >-
        ${LOREHUB_LORE_INTERNAL_DOMAIN:?LOREHUB_LORE_INTERNAL_DOMAIN is required}
      LOREHUB_LORE_AUTH_ISSUER: ${LOREHUB_LORE_AUTH_ISSUER:?LOREHUB_LORE_AUTH_ISSUER is required}
      LOREHUB_LORE_AUTH_AUDIENCE: ${LOREHUB_LORE_AUTH_AUDIENCE:?LOREHUB_LORE_AUTH_AUDIENCE is required}
      LOREHUB_LORE_AUTH_URL: ${LOREHUB_LORE_AUTH_URL:?LOREHUB_LORE_AUTH_URL is required}
      LOREHUB_LORE_AUTH_JWKS_URL: ${LOREHUB_LORE_AUTH_JWKS_URL:?LOREHUB_LORE_AUTH_JWKS_URL is required}
      LOREHUB_LORE_POLICY_ENDPOINT: ${LOREHUB_LORE_POLICY_ENDPOINT:?LOREHUB_LORE_POLICY_ENDPOINT is required}
      LOREHUB_LORE_OBSERVATION_ENDPOINT: ${LOREHUB_LORE_OBSERVATION_ENDPOINT:?required}
      LOREHUB_LORE_INTERNAL_AUTH_JWKS_URL: >-
        ${LOREHUB_LORE_INTERNAL_AUTH_JWKS_URL:?required}
      LOREHUB_LORE_INTERNAL_AUTH_URL: ${LOREHUB_LORE_INTERNAL_AUTH_URL:?LOREHUB_LORE_INTERNAL_AUTH_URL is required}
      LOREHUB_LORE_INTERNAL_POLICY_ENDPOINT: >-
        ${LOREHUB_LORE_INTERNAL_POLICY_ENDPOINT:?required}
      LOREHUB_LORE_INTERNAL_OBSERVATION_ENDPOINT: >-
        ${LOREHUB_LORE_INTERNAL_OBSERVATION_ENDPOINT:?required}
    ports:
      - "127.0.0.1:${LORE_HOST_PORT:-41337}:41337/tcp"
      - "127.0.0.1:${LORE_HOST_PORT:-41337}:41337/udp"
      - "127.0.0.1:${LORE_HTTP_HOST_PORT:-41339}:41339"
    volumes:
      - lore-data:/data
      - auth-tls:/etc/lore/auth-tls:ro
    depends_on:
      api:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - "lore.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
      runner-data:
        ipv4_address: 172.28.239.4
        aliases:
          - "lore.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      DATABASE_URL: postgresql://lorehub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/lorehub
      LOREHUB_ENV: ${LOREHUB_ENV:-development}
      LOREHUB_AUTH_MODE: ${LOREHUB_AUTH_MODE:-interactive}
      LOREHUB_HTTP_ADDRESS: :8080
      LOREHUB_LORE_ROOT_DOMAIN: ${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}
      LOREHUB_LORE_AUTH_ISSUER: ${LOREHUB_LORE_AUTH_ISSUER:?LOREHUB_LORE_AUTH_ISSUER is required}
      LOREHUB_LORE_AUTH_AUDIENCE: ${LOREHUB_LORE_AUTH_AUDIENCE:?LOREHUB_LORE_AUTH_AUDIENCE is required}
      LOREHUB_LORE_AUTHORITY: ${LOREHUB_LORE_AUTHORITY:?LOREHUB_LORE_AUTHORITY is required}
      LOREHUB_LORE_AUTH_URL: ${LOREHUB_LORE_AUTH_URL:?LOREHUB_LORE_AUTH_URL is required}
      LOREHUB_LORE_AUTH_JWKS_URL: ${LOREHUB_LORE_AUTH_JWKS_URL:?LOREHUB_LORE_AUTH_JWKS_URL is required}
      LOREHUB_LORE_POLICY_ENDPOINT: ${LOREHUB_LORE_POLICY_ENDPOINT:?LOREHUB_LORE_POLICY_ENDPOINT is required}
      LOREHUB_LORE_OBSERVATION_ENDPOINT: ${LOREHUB_LORE_OBSERVATION_ENDPOINT:?required}
      LOREHUB_LORE_AUTH_LOGIN_URL: ${LOREHUB_LORE_AUTH_LOGIN_URL:?LOREHUB_LORE_AUTH_LOGIN_URL is required}
      LOREHUB_LORE_PUBLIC_URL: ${LOREHUB_LORE_PUBLIC_URL:?LOREHUB_LORE_PUBLIC_URL is required}
      LOREHUB_LORE_INTERNAL_URL: >-
        lores://lore.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}:41337
      LOREHUB_LORE_AUTH_ADDRESS: :8443
      LOREHUB_LORE_AUTH_COMPAT_ADDRESS: :${LOREHUB_AUTH_HOST_PORT:-8443}
      LOREHUB_LORE_AUTH_TLS_CERT: /var/lib/lorehub/tls/server.crt
      LOREHUB_LORE_AUTH_TLS_KEY: /var/lib/lorehub/tls/server.key
      LOREHUB_AUTH_SIGNING_KEY_PATH: /var/lib/lorehub/keys/lore-auth.pem
      LOREHUB_AUTH_SIGNING_KEY_KID: ${LOREHUB_AUTH_SIGNING_KEY_KID:?LOREHUB_AUTH_SIGNING_KEY_KID is required}
      LOREHUB_METRICS_TOKEN: ${LOREHUB_METRICS_TOKEN:?LOREHUB_METRICS_TOKEN is required}
      LOREHUB_RATE_LIMIT_REQUESTS: ${LOREHUB_RATE_LIMIT_REQUESTS:-600}
      LOREHUB_RATE_LIMIT_WINDOW: ${LOREHUB_RATE_LIMIT_WINDOW:-1m}
      LOREHUB_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LOREHUB_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}
      LOREHUB_ACTIONS_SECRET_KEY_ID: ${LOREHUB_ACTIONS_SECRET_KEY_ID:?LOREHUB_ACTIONS_SECRET_KEY_ID is required}
      LOREHUB_ACTIONS_SECRET_KEY: ${LOREHUB_ACTIONS_SECRET_KEY:?LOREHUB_ACTIONS_SECRET_KEY is required}
      LOREHUB_ACTIONS_JOB_TOKEN_AUDIENCE: ${LOREHUB_ACTIONS_JOB_TOKEN_AUDIENCE:-}
      LOREHUB_RUNNER_TOKEN_KEY_ID: ${LOREHUB_RUNNER_TOKEN_KEY_ID:?LOREHUB_RUNNER_TOKEN_KEY_ID is required}
      LOREHUB_RUNNER_TOKEN_KEY: ${LOREHUB_RUNNER_TOKEN_KEY:?LOREHUB_RUNNER_TOKEN_KEY is required}
      LOREHUB_WEBHOOK_SECRET_KEY_ID: ${LOREHUB_WEBHOOK_SECRET_KEY_ID:?LOREHUB_WEBHOOK_SECRET_KEY_ID is required}
      LOREHUB_WEBHOOK_SECRET_KEY: ${LOREHUB_WEBHOOK_SECRET_KEY:?LOREHUB_WEBHOOK_SECRET_KEY is required}
      LOREHUB_WEBHOOK_POLL_PERIOD: ${LOREHUB_WEBHOOK_POLL_PERIOD:-2s}
      LOREHUB_WEBHOOK_REQUEST_TIMEOUT: ${LOREHUB_WEBHOOK_REQUEST_TIMEOUT:-10s}
      LOREHUB_WEBHOOK_LEASE_DURATION: ${LOREHUB_WEBHOOK_LEASE_DURATION:-30s}
      LOREHUB_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${LOREHUB_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      LOREHUB_LORES_TOKEN_KEY_ID: ${LOREHUB_LORES_TOKEN_KEY_ID:?LOREHUB_LORES_TOKEN_KEY_ID is required}
      LOREHUB_LORES_TOKEN_KEY: ${LOREHUB_LORES_TOKEN_KEY:?LOREHUB_LORES_TOKEN_KEY is required}
      LOREHUB_LORE_ALLOW_PRIVATE_SERVERS: ${LOREHUB_LORE_ALLOW_PRIVATE_SERVERS:-false}
      LOREHUB_LORE_SERVER_CA_CERT: ${LOREHUB_LORE_SERVER_CA_CERT:-/var/lib/lorehub/tls/ca.crt}
      LOREHUB_LORE_SERVER_CA_KEY: ${LOREHUB_LORE_SERVER_CA_KEY:-/var/lib/lorehub/tls-ca/ca.key}
      LOREHUB_NOTIFICATION_EMAIL_ENABLED: ${LOREHUB_NOTIFICATION_EMAIL_ENABLED:-true}
      LOREHUB_NOTIFICATION_EMAIL_POLL_PERIOD: ${LOREHUB_NOTIFICATION_EMAIL_POLL_PERIOD:-2s}
      LOREHUB_NOTIFICATION_EMAIL_SEND_TIMEOUT: ${LOREHUB_NOTIFICATION_EMAIL_SEND_TIMEOUT:-10s}
      LOREHUB_NOTIFICATION_EMAIL_LEASE_DURATION: ${LOREHUB_NOTIFICATION_EMAIL_LEASE_DURATION:-30s}
      LOREHUB_NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${LOREHUB_NOTIFICATION_EMAIL_MAX_ATTEMPTS:-8}
      LOREHUB_SMTP_HOST: ${LOREHUB_SMTP_HOST:-mailpit}
      LOREHUB_SMTP_PORT: ${LOREHUB_SMTP_PORT:-1025}
      LOREHUB_SMTP_USERNAME: ${LOREHUB_SMTP_USERNAME:-}
      LOREHUB_SMTP_PASSWORD: ${LOREHUB_SMTP_PASSWORD:-}
      LOREHUB_SMTP_FROM_ADDRESS: ${LOREHUB_SMTP_FROM_ADDRESS:-notifications@lorehub.localhost}
      LOREHUB_SMTP_FROM_NAME: ${LOREHUB_SMTP_FROM_NAME:-LoreHub}
      LOREHUB_SMTP_TLS_MODE: ${LOREHUB_SMTP_TLS_MODE:-none}
      LOREHUB_REPOSITORY_DELETION_RETENTION: ${LOREHUB_REPOSITORY_DELETION_RETENTION:-720h}
      LOREHUB_REPOSITORY_DELETION_POLL_PERIOD: ${LOREHUB_REPOSITORY_DELETION_POLL_PERIOD:-30s}
      LOREHUB_REPOSITORY_DELETION_TIMEOUT: ${LOREHUB_REPOSITORY_DELETION_TIMEOUT:-90s}
      LOREHUB_REPOSITORY_DELETION_LEASE_DURATION: ${LOREHUB_REPOSITORY_DELETION_LEASE_DURATION:-2m}
      LOREHUB_POLICY_ADDRESS: :8444
      LOREHUB_POLICY_TLS_CERT: /var/lib/lorehub/tls/server.crt
      LOREHUB_POLICY_TLS_KEY: /var/lib/lorehub/tls/server.key
      LOREHUB_POLICY_TLS_CLIENT_CA: /var/lib/lorehub/tls/ca.crt
      LOREHUB_LORE_PUBLIC_READER_SUBJECT: ${LOREHUB_LORE_PUBLIC_READER_SUBJECT:?required}
      LOREHUB_LORE_ACTIONS_RUNNER_SUBJECT: ${LOREHUB_LORE_ACTIONS_RUNNER_SUBJECT:?required}
      LOREHUB_OBSERVER_SERVICE_PRINCIPAL: ${LOREHUB_OBSERVER_SERVICE_PRINCIPAL:?required}
      LOREHUB_LORE_REPOSITORY_REGISTRATION_SUBJECT: ${LOREHUB_LORE_REPOSITORY_REGISTRATION_SUBJECT:?required}
      LOREHUB_LORE_REPOSITORY_LIFECYCLE_SUBJECT: ${LOREHUB_LORE_REPOSITORY_LIFECYCLE_SUBJECT:?required}
      LOREHUB_LORE_IDENTITY: ${LOREHUB_LORE_IDENTITY:-}
      LOREHUB_LORE_CREDENTIALS: ${LOREHUB_LORE_CREDENTIALS:-}
      LOREHUB_LORE_ALLOW_DEVELOPMENT_FALLBACK: ${LOREHUB_LORE_ALLOW_DEVELOPMENT_FALLBACK:-false}
      LOREHUB_DEV_ALLOW_LORE_IDENTITY_FALLBACK: ${LOREHUB_DEV_ALLOW_LORE_IDENTITY_FALLBACK:-false}
      LOREHUB_DEV_LORE_IDENTITY: ${LOREHUB_DEV_LORE_IDENTITY:-}
      LOREHUB_OIDC_ISSUER: ${LOREHUB_OIDC_ISSUER:-http://keycloak.localhost:8280/realms/lorehub}
      LOREHUB_OIDC_AUDIENCE: ${LOREHUB_OIDC_AUDIENCE:-lorehub-api}
      LOREHUB_OIDC_CLIENT_ID: ${LOREHUB_OIDC_CLIENT_ID:-lorehub-web}
      LOREHUB_OIDC_CLIENT_SECRET: ${LOREHUB_OIDC_CLIENT_SECRET:?LOREHUB_OIDC_CLIENT_SECRET is required}
      LOREHUB_OIDC_REDIRECT_URL: ${LOREHUB_OIDC_REDIRECT_URL:-http://localhost:3000/auth/callback}
      LOREHUB_PUBLIC_ORIGIN: ${LOREHUB_PUBLIC_ORIGIN:-http://localhost:3000}
      LOREHUB_AUTH_SECRET: ${LOREHUB_AUTH_SECRET:?LOREHUB_AUTH_SECRET is required}
      LOREHUB_SESSION_COOKIE_NAME: ${LOREHUB_SESSION_COOKIE_NAME:-lorehub_session}
      LOREHUB_LOGIN_BINDING_COOKIE_NAME: ${LOREHUB_LOGIN_BINDING_COOKIE_NAME:-lorehub_login_binding}
      LOREHUB_SESSION_COOKIE_PATH: ${LOREHUB_SESSION_COOKIE_PATH:-/}
      LOREHUB_SESSION_COOKIE_DOMAIN: ${LOREHUB_SESSION_COOKIE_DOMAIN:-}
      LOREHUB_SESSION_COOKIE_SECURE: ${LOREHUB_SESSION_COOKIE_SECURE:-false}
      LOREHUB_SESSION_TTL: ${LOREHUB_SESSION_TTL:-720h}
      LOREHUB_LOGIN_TRANSACTION_TTL: ${LOREHUB_LOGIN_TRANSACTION_TTL:-10m}
      LOREHUB_RUNNER_ARTIFACT_DIR: /var/lib/lorehub/runner-data/runner-artifacts
      LOREHUB_RUNNER_LOG_DIR: /var/lib/lorehub/runner-data/runner-logs
      LOREHUB_IDP_GOOGLE_CLIENT_ID: ${LOREHUB_IDP_GOOGLE_CLIENT_ID:-}
      LOREHUB_IDP_GOOGLE_CLIENT_SECRET: ${LOREHUB_IDP_GOOGLE_CLIENT_SECRET:-}
      LOREHUB_IDP_GITHUB_CLIENT_ID: ${LOREHUB_IDP_GITHUB_CLIENT_ID:-}
      LOREHUB_IDP_GITHUB_CLIENT_SECRET: ${LOREHUB_IDP_GITHUB_CLIENT_SECRET:-}
      LOREHUB_IDP_FACEBOOK_CLIENT_ID: ${LOREHUB_IDP_FACEBOOK_CLIENT_ID:-}
      LOREHUB_IDP_FACEBOOK_CLIENT_SECRET: ${LOREHUB_IDP_FACEBOOK_CLIENT_SECRET:-}
      LOREHUB_IDP_X_CLIENT_ID: ${LOREHUB_IDP_X_CLIENT_ID:-}
      LOREHUB_IDP_X_CLIENT_SECRET: ${LOREHUB_IDP_X_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}:host-gateway"
      - "auth.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}:host-gateway"
      - "api.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}:host-gateway"
    networks:
      default:
        aliases:
          - "${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "api.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "auth.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "api.${LOREHUB_LORE_INTERNAL_DOMAIN:?LOREHUB_LORE_INTERNAL_DOMAIN is required}"
      runner-data:
        aliases:
          - "${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "api.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "auth.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}"
          - "api.${LOREHUB_LORE_INTERNAL_DOMAIN:?LOREHUB_LORE_INTERNAL_DOMAIN is required}"
    ports:
      - "${LOREHUB_HOST_PORT:-8080}:8080"
      - "${LOREHUB_AUTH_HOST_PORT:-8443}:8443"
      - "${LOREHUB_POLICY_HOST_PORT:-8444}:8444"
    volumes:
      - api-data:/var/lib/lorehub
      - auth-signing:/var/lib/lorehub/keys
      - auth-tls:/var/lib/lorehub/tls:ro
      - auth-ca-state:/var/lib/lorehub/tls-ca:ro
      - runner-data:/var/lib/lorehub/runner-data:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    environment:
      LOREHUB_API_URL: ${LOREHUB_WEB_API_URL:?LOREHUB_WEB_API_URL is required}
      LOREHUB_OIDC_ISSUER: ${LOREHUB_OIDC_ISSUER:?LOREHUB_OIDC_ISSUER is required}
      LOREHUB_OIDC_CLIENT_ID: ${LOREHUB_OIDC_CLIENT_ID:?LOREHUB_OIDC_CLIENT_ID is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LOREHUB_WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  runner:
    profiles: ["runner"]
    platform: linux/amd64
    user: "lorehub:lorehub"
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    command: ["runner"]
    environment:
      DATABASE_URL: postgresql://lorehub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/lorehub
      DOCKER_HOST: tcp://runner-engine:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /etc/lorehub/docker-client
      SSL_CERT_FILE: /var/lib/lorehub/tls/ca.crt
      LOREHUB_ENV: ${LOREHUB_ENV:-development}
      LOREHUB_AUTH_MODE: ${LOREHUB_RUNNER_AUTH_MODE:-disabled}
      LOREHUB_OIDC_ISSUER: ${LOREHUB_OIDC_ISSUER:?LOREHUB_OIDC_ISSUER is required}
      LOREHUB_OIDC_AUDIENCE: ${LOREHUB_OIDC_AUDIENCE:?LOREHUB_OIDC_AUDIENCE is required}
      LOREHUB_LORE_ROOT_DOMAIN: ${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}
      LOREHUB_LORE_AUTH_ISSUER: ${LOREHUB_LORE_AUTH_ISSUER:?LOREHUB_LORE_AUTH_ISSUER is required}
      LOREHUB_LORE_AUTH_AUDIENCE: ${LOREHUB_LORE_AUTH_AUDIENCE:?LOREHUB_LORE_AUTH_AUDIENCE is required}
      LOREHUB_LORE_AUTHORITY: ${LOREHUB_LORE_AUTHORITY:?LOREHUB_LORE_AUTHORITY is required}
      LOREHUB_LORE_AUTH_URL: ${LOREHUB_LORE_AUTH_URL:?LOREHUB_LORE_AUTH_URL is required}
      LOREHUB_LORE_AUTH_LOGIN_URL: ${LOREHUB_LORE_AUTH_LOGIN_URL:?LOREHUB_LORE_AUTH_LOGIN_URL is required}
      LOREHUB_LORE_AUTH_JWKS_URL: ${LOREHUB_LORE_AUTH_JWKS_URL:?LOREHUB_LORE_AUTH_JWKS_URL is required}
      LOREHUB_LORE_POLICY_ENDPOINT: ${LOREHUB_LORE_POLICY_ENDPOINT:?LOREHUB_LORE_POLICY_ENDPOINT is required}
      LOREHUB_LORE_OBSERVATION_ENDPOINT: ${LOREHUB_LORE_OBSERVATION_ENDPOINT:?required}
      LOREHUB_LORE_PUBLIC_URL: ${LOREHUB_LORE_PUBLIC_URL:?LOREHUB_LORE_PUBLIC_URL is required}
      LOREHUB_LORE_INTERNAL_URL: >-
        lores://lore.${LOREHUB_LORE_ROOT_DOMAIN:?LOREHUB_LORE_ROOT_DOMAIN is required}:41337
      LOREHUB_AUTH_SIGNING_KEY_PATH: ${LOREHUB_AUTH_SIGNING_KEY_PATH:-/var/lib/lorehub/keys/lore-auth.pem}
      LOREHUB_AUTH_SIGNING_KEY_KID: ${LOREHUB_AUTH_SIGNING_KEY_KID:?LOREHUB_AUTH_SIGNING_KEY_KID is required}
      LOREHUB_ACTIONS_SECRET_KEY_ID: ${LOREHUB_ACTIONS_SECRET_KEY_ID:?LOREHUB_ACTIONS_SECRET_KEY_ID is required}
      LOREHUB_ACTIONS_SECRET_KEY: ${LOREHUB_ACTIONS_SECRET_KEY:?LOREHUB_ACTIONS_SECRET_KEY is required}
      LOREHUB_ACTIONS_JOB_TOKEN_AUDIENCE: ${LOREHUB_ACTIONS_JOB_TOKEN_AUDIENCE:-}
      LOREHUB_LORE_AUTH_TLS_CERT: ${LOREHUB_LORE_AUTH_TLS_CERT:-/var/lib/lorehub/tls/server.crt}
      LOREHUB_LORE_AUTH_TLS_KEY: ${LOREHUB_LORE_AUTH_TLS_KEY:-/var/lib/lorehub/tls/server.key}
      LOREHUB_POLICY_TLS_CERT: ${LOREHUB_POLICY_TLS_CERT:-/var/lib/lorehub/tls/server.crt}
      LOREHUB_POLICY_TLS_KEY: ${LOREHUB_POLICY_TLS_KEY:-/var/lib/lorehub/tls/server.key}
      LOREHUB_POLICY_TLS_CLIENT_CA: ${LOREHUB_POLICY_TLS_CLIENT_CA:-/var/lib/lorehub/tls/ca.crt}
      LOREHUB_LORE_PUBLIC_READER_SUBJECT: ${LOREHUB_LORE_PUBLIC_READER_SUBJECT:?required}
      LOREHUB_LORE_ACTIONS_RUNNER_SUBJECT: ${LOREHUB_LORE_ACTIONS_RUNNER_SUBJECT:?required}
      LOREHUB_OBSERVER_SERVICE_PRINCIPAL: ${LOREHUB_OBSERVER_SERVICE_PRINCIPAL:?required}
      LOREHUB_LORE_REPOSITORY_REGISTRATION_SUBJECT: ${LOREHUB_LORE_REPOSITORY_REGISTRATION_SUBJECT:?required}
      LOREHUB_LORE_IDENTITY: ${LOREHUB_LORE_IDENTITY:-}
      LOREHUB_LORE_CREDENTIALS: ${LOREHUB_LORE_CREDENTIALS:-}
      LOREHUB_LORE_ALLOW_DEVELOPMENT_FALLBACK: ${LOREHUB_LORE_ALLOW_DEVELOPMENT_FALLBACK:-false}
      LOREHUB_DEV_ALLOW_LORE_IDENTITY_FALLBACK: ${LOREHUB_DEV_ALLOW_LORE_IDENTITY_FALLBACK:-false}
      LOREHUB_DEV_LORE_IDENTITY: ${LOREHUB_DEV_LORE_IDENTITY:-}
      LOREHUB_PUBLIC_ORIGIN: ${LOREHUB_PUBLIC_ORIGIN:-http://localhost:3000}
      LOREHUB_PUBLIC_API_URL: ${LOREHUB_PUBLIC_API_URL:-}
      LOREHUB_PUBLIC_GRAPHQL_URL: ${LOREHUB_PUBLIC_GRAPHQL_URL:-}
      LOREHUB_ACTION_SOURCE_URL: ${LOREHUB_ACTION_SOURCE_URL:-https://github.com}
      LOREHUB_RUNNER_PLATFORM_IMAGES: ${LOREHUB_RUNNER_PLATFORM_IMAGES:-}
      LOREHUB_DEV_ALLOW_ACTIONS_CONTEXT_FALLBACK: ${LOREHUB_DEV_ALLOW_ACTIONS_CONTEXT_FALLBACK:-false}
      LOREHUB_DEV_ACTIONS_CONTEXT_JSON: ${LOREHUB_DEV_ACTIONS_CONTEXT_JSON:-}
      LOREHUB_DEV_ALLOW_ACTIONS_JOB_TOKEN_FALLBACK: ${LOREHUB_DEV_ALLOW_ACTIONS_JOB_TOKEN_FALLBACK:-false}
      LOREHUB_DEV_ACTIONS_JOB_TOKEN: ${LOREHUB_DEV_ACTIONS_JOB_TOKEN:-}
      LOREHUB_RUNNER_LOG_MAX_LINE_BYTES: ${LOREHUB_RUNNER_LOG_MAX_LINE_BYTES:-1048576}
      LOREHUB_RUNNER_PROXY_URL: http://172.28.244.10:3128
      LOREHUB_RUNNER_ENGINE_PROXY_URL: http://172.28.241.10:3128
      HTTP_PROXY: http://172.28.244.10:3128
      HTTPS_PROXY: http://172.28.244.10:3128
      http_proxy: http://172.28.244.10:3128
      https_proxy: http://172.28.244.10:3128
      NO_PROXY: postgres,lore,runner-engine,172.28.239.0/24,172.28.240.0/24
      no_proxy: postgres,lore,runner-engine,172.28.239.0/24,172.28.240.0/24
      LOREHUB_LORE_CACHE_DIR: /var/lib/lorehub/runner-data/repositories
      LOREHUB_RUNNER_ARTIFACT_DIR: /var/lib/lorehub/runner-data/runner-artifacts
      LOREHUB_RUNNER_LOG_DIR: /var/lib/lorehub/runner-data/runner-logs
      LOREHUB_RUNNER_WORK_DIR: /var/lib/lorehub/runner-data/runner-work
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      lore:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
      runner-engine:
        condition: service_healthy
      runner-cert-init:
        condition: service_completed_successfully
      runner-data-init:
        condition: service_completed_successfully
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      runner-data: {}
      runner-control: {}
      runner-action:
        ipv4_address: 172.28.244.2
    volumes:
      - runner-data:/var/lib/lorehub/runner-data
      - runner-engine-client-certs:/etc/lorehub/docker-client:ro
      - auth-signing:/var/lib/lorehub/keys:ro
      - auth-tls:/var/lib/lorehub/tls:ro

  runner-data-init:
    profiles: ["runner"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /var/lib/lorehub/runner-data/repositories
        /var/lib/lorehub/runner-data/runner-logs
        /var/lib/lorehub/runner-data/runner-artifacts
        /var/lib/lorehub/runner-data/runner-work
        && chown -R lorehub:lorehub /var/lib/lorehub/runner-data
    user: "0:0"
    restart: "no"
    volumes:
      - runner-data:/var/lib/lorehub/runner-data

  runner-engine:
    profiles: ["runner"]
    platform: linux/amd64
    image: docker:29.4.0-dind-rootless
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:runner-engine
      HTTP_PROXY: http://172.28.241.10:3128
      HTTPS_PROXY: http://172.28.241.10:3128
      http_proxy: http://172.28.241.10:3128
      https_proxy: http://172.28.241.10:3128
      NO_PROXY: runner-engine,172.28.241.10
      no_proxy: runner-engine,172.28.241.10
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: slirp4netns
    privileged: true
    cpus: 3
    mem_limit: 4g
    pids_limit: 1024
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          docker -H tcp://127.0.0.1:2376 --tlsverify
          --tlscacert=/certs/client/ca.pem
          --tlscert=/certs/client/cert.pem
          --tlskey=/certs/client/key.pem info
          | grep -q 'rootless'
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      runner-control:
        ipv4_address: 172.28.240.3
      runner-egress:
        ipv4_address: 172.28.241.2
    volumes:
      - runner-engine-data:/home/rootless/.local/share/docker
      - runner-engine-certs:/certs
    depends_on:
      runner-proxy:
        condition: service_healthy

  runner-proxy:
    profiles: ["runner"]
    image: ubuntu/squid:7.2-26.04_edge
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /run:uid=584792,gid=584792,mode=1770
      - /var/cache/squid:uid=584792,gid=584792,mode=1770
      - /var/log/squid:uid=584792,gid=584792,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/squid-gnutls -k parse -f /etc/squid/squid.conf >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      runner-egress:
        ipv4_address: 172.28.241.10
      runner-uplink:
        ipv4_address: 172.28.242.10
      runner-action:
        ipv4_address: 172.28.244.10
    volumes:
      - ./runner/squid.conf:/etc/squid/squid.conf:ro

  runner-canary:
    profiles: ["runner-smoke"]
    image: python:3.13.7-alpine3.21
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    ports:
      - "${RUNNER_CANARY_HOST_PORT:-41337}:8080"
    networks: [runner-canary]
    restart: "no"

  runner-cert-init:
    profiles: ["runner"]
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        test -r /engine-certs/client/ca.pem;
        test -r /engine-certs/client/cert.pem;
        test -r /engine-certs/client/key.pem;
        install -d -m 0750 /client-certs;
        install -m 0644 /engine-certs/client/ca.pem /client-certs/ca.pem;
        install -m 0644 /engine-certs/client/cert.pem /client-certs/cert.pem;
        install -m 0600 /engine-certs/client/key.pem /client-certs/key.pem;
        chown -R lorehub:lorehub /client-certs
    user: "0:0"
    restart: "no"
    depends_on:
      runner-engine:
        condition: service_healthy
    volumes:
      - runner-engine-certs:/engine-certs:ro
      - runner-engine-client-certs:/client-certs

  # Dedicated PostgreSQL for Keycloak. Deliberately separate from the LoreHub
  # application database above: Keycloak owns its own credentials, schema, and
  # backup cadence, and must never mutate or share the LoreHub database.
  keycloak-postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    restart: unless-stopped

  # Keycloak runs in production mode (`start`, not `start-dev`). Local HTTP is
  # enabled explicitly via --http-enabled and the hostname is fixed so the
  # advertised issuer is stable. The image is built from infra/keycloak/Dockerfile
  # so the PostgreSQL db vendor is set at build time (required for --optimized).
  # See docs/operations/keycloak.md for TLS / reverse-proxy and local discovery.
  keycloak:
    build:
      context: ..
      dockerfile: infra/keycloak/Dockerfile
    image: lorehub/keycloak:26.7.1
    command:
      - start
      - --optimized
      - --import-realm
      - --hostname=${KEYCLOAK_HOSTNAME:-http://keycloak.localhost:8280}
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=forwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      # LOREHUB_OIDC_CLIENT_SECRET is substituted into the realm import JSON
      # for the lorehub-web client's secret field. Required when importing the
      # realm; generate it with scripts/setup-keycloak-secrets.sh.
      LOREHUB_OIDC_CLIENT_SECRET: ${LOREHUB_OIDC_CLIENT_SECRET:?LOREHUB_OIDC_CLIENT_SECRET is required}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${KEYCLOAK_HOST_PORT:-8280}:8080"
    volumes:
      - ./keycloak/realm-lorehub.json:/opt/keycloak/data/import/realm-lorehub.json:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  # One-shot idempotent provisioning of social identity providers via the
  # Keycloak Admin CLI. A provider is created only when its credentials are
  # present in the environment, so missing providers never appear as broken
  # login buttons. Re-runs update existing providers in place.
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.1
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      LOREHUB_REALM: ${KEYCLOAK_REALM:-lorehub}
      LOREHUB_ENV: ${LOREHUB_ENV:-development}
      LOREHUB_VERIFY_EMAIL: ${LOREHUB_VERIFY_EMAIL:-false}
      LOREHUB_OIDC_CLIENT_ID: ${LOREHUB_OIDC_CLIENT_ID:-lorehub-web}
      LOREHUB_OIDC_CLIENT_SECRET: ${LOREHUB_OIDC_CLIENT_SECRET:?LOREHUB_OIDC_CLIENT_SECRET is required}
      LOREHUB_OIDC_REDIRECT_URL: ${LOREHUB_OIDC_REDIRECT_URL:-http://localhost:3000/auth/callback}
      LOREHUB_OIDC_LOGOUT_REDIRECT_URL: ${LOREHUB_OIDC_LOGOUT_REDIRECT_URL:-http://localhost:3000/}
      LOREHUB_PUBLIC_ORIGIN: ${LOREHUB_PUBLIC_ORIGIN:-http://localhost:3000}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-LoreHub}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO:-}
      KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME: ${KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME:-LoreHub}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-true}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      LOREHUB_IDP_GOOGLE_CLIENT_ID: ${LOREHUB_IDP_GOOGLE_CLIENT_ID:-}
      LOREHUB_IDP_GOOGLE_CLIENT_SECRET: ${LOREHUB_IDP_GOOGLE_CLIENT_SECRET:-}
      LOREHUB_IDP_GOOGLE_HOSTED_DOMAIN: ${LOREHUB_IDP_GOOGLE_HOSTED_DOMAIN:-}
      LOREHUB_IDP_GITHUB_CLIENT_ID: ${LOREHUB_IDP_GITHUB_CLIENT_ID:-}
      LOREHUB_IDP_GITHUB_CLIENT_SECRET: ${LOREHUB_IDP_GITHUB_CLIENT_SECRET:-}
      LOREHUB_IDP_FACEBOOK_CLIENT_ID: ${LOREHUB_IDP_FACEBOOK_CLIENT_ID:-}
      LOREHUB_IDP_FACEBOOK_CLIENT_SECRET: ${LOREHUB_IDP_FACEBOOK_CLIENT_SECRET:-}
      LOREHUB_IDP_X_CLIENT_ID: ${LOREHUB_IDP_X_CLIENT_ID:-}
      LOREHUB_IDP_X_CLIENT_SECRET: ${LOREHUB_IDP_X_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    restart: "no"

volumes:
  auth-ca-state:
  auth-tls:
  auth-signing:
  api-data:
  lore-data:
  postgres-data:
  runner-data:
  runner-engine-data:
  runner-engine-certs:
  runner-engine-client-certs:
  keycloak-postgres-data:
  keycloak-data:
  mailpit-data:

networks:
  runner-data:
    internal: true
    ipam:
      config:
        - subnet: 172.28.239.0/24
  runner-control:
    internal: true
    ipam:
      config:
        - subnet: 172.28.240.0/24
  runner-egress:
    internal: true
    ipam:
      config:
        - subnet: 172.28.241.0/24
  runner-uplink:
    ipam:
      config:
        - subnet: 172.28.242.0/24
  runner-action:
    internal: true
    ipam:
      config:
        - subnet: 172.28.244.0/24
  runner-canary:
    ipam:
      config:
        - subnet: 172.28.243.0/24
