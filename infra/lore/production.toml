[server.quic.certificate]
cert_file = "/etc/lore/auth-tls/server.crt"
pkey_file = "/etc/lore/auth-tls/server.key"

[server.grpc]
verify_client_certs = false

[server.grpc.certificate]
cert_file = "/etc/lore/auth-tls/server.crt"
pkey_file = "/etc/lore/auth-tls/server.key"

[server.auth]
jwt_issuer = "auth.lorehub.example"
jwt_audience = ["lorehub.example"]

[server.quic]
verify_client_certs = false

[server.auth.jwk]
endpoint = "https://api.lorehub.example/.well-known/jwks.json"

[environment.endpoint]
auth_url = "ucs-auth://auth.lorehub.example:8443"

[hooks.lorehub_policy]
enabled = true
endpoint = "https://api.lorehub.example:8444/internal/lore/policy"
observation_endpoint = "https://api.lorehub.example:8444/internal/lore/observation"
ca_certificate = "/etc/lore/auth-tls/ca.crt"
client_certificate = "/etc/lore/auth-tls/lore-client.crt"
client_key = "/etc/lore/auth-tls/lore-client.key"

[immutable_store.local]
path = "/data/store"
flush_delay_seconds = 10

[mutable_store.local]
path = "/data/store"
flush_delay_seconds = 10

[topology]
provider = "none"
